[package]
name = "pebl"
version = "0.3.0"
edition = "2021"
description = "A terminal-native orchestrator for Claude Code sessions"
license = "MIT"
repository = "https://github.com/buricodes/pebl"
readme = "README.md"

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
crossterm = "0.29"
dirs = "6"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.9"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
insta = "1"
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
